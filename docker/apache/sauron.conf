# Global Sauron CGI + static assets (applies to all vhosts, including 000-default).
# Enabled via: a2enconf sauron

# Suppress AH00558 (container hostname is not a FQDN)
ServerName localhost

# CGI scripts (sauron.cgi, browser.cgi)
ScriptAlias /cgi-bin/ /usr/local/sauron/cgi/

<Directory "/usr/local/sauron/cgi">
	AllowOverride None
	Options -MultiViews +SymLinksIfOwnerMatch
	Require all granted
</Directory>

# Static icons / CSS / JS used by the CGI UI
Alias /sauron/icons/ /usr/local/sauron/icons/
<Directory "/usr/local/sauron/icons">
	Options -Indexes +FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>

# Perl / locale for CGI processes
# PassEnv lets the container's PERL5LIB (e.g. dev overlay with lib-dev)
# flow through to CGI scripts, while production still uses /usr/local/sauron.
PassEnv PERL5LIB
SetEnv LANG C.UTF-8
SetEnv LC_ALL C.UTF-8
