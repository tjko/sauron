# lab.conf -- plugin definition file for plugin: lab
#
# Sauron training lab: shows the lab tasks and whether they are done
# (see lab/README.md). Enable with $SAURON_PLUGINS = 'lab'; in the config.

# name of the plugin
$NAME = 'lab';

# name of menu where to append commands
$MENU = 'hosts';

# commands to append to menu: [text, default sub, subs of the plugin...]
$MENUDATA = [
	     [],
	     ['Lab tasks', 'sub=Pl_Lab', 'Pl_Lab'],
	    ];

# Authorization level needed to use this plugin (everybody).
$ALEVEL = 0;

1;

# eof
