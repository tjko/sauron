failover peer "foobar" {
	primary;
	address ns1.middle.earth;
	port 519;
	peer address ns2.middle.earth;
	peer port 519;
	max-response-delay 60;
	max-unacked-updates 10;
	mclt 3600;
	split 128;
	load balance max seconds 3;
}


# local options

log-facility local7;	 # local c



# global options

authoritative;
allow bootp;
use-host-decl-names on;
default-lease-time 32000;
max-lease-time 64000;
ddns-update-style none;
option domain-name-servers ns1.middle.earth,ns2.middle.earth;
option ntp-servers ns1.middle.earth,ns2.middle.earth;
option domain-name "middle.earth";	 # global c



# (dynamic) classes


class "vip" {
	match pick-first-value (option dhcp-client-identifier, hardware);
	option domain-name "vip.middle.earth";	 #vip c
}

subclass "vip" 1:00:30:40:50:60:00;  # ws1
subclass "vip" 1:0a:0b:0c:0d:0e:01;  # pxe1


